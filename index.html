<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Dino Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-area">
            <div class="ground"></div>
            <div class="dino">
                <div class="dino-body"></div>
                <div class="dino-head"></div>
                <div class="dino-neck"></div>
                <div class="dino-eye">
                    <div class="dino-pupil"></div>
                </div>
                <div class="dino-nostril"></div>
                <div class="dino-mouth"></div>
                <div class="dino-leg front"></div>
                <div class="dino-leg back"></div>
                <div class="dino-arm"></div>
                <div class="dino-arm left"></div>
                <div class="dino-tail"></div>
            </div>
            <div class="cactus">
                <div class="cactus-main"></div>
                <div class="cactus-arm-left"></div>
                <div class="cactus-arm-right"></div>
                <div class="cactus-small"></div>
            </div>
            <div class="cloud"></div>
            <div class="score">0</div>
            <div class="game-over">Game Over</div>
            <button class="continue-btn" id="continue-btn">Продолжить</button>
            <div class="start-screen">Нажмите, чтобы начать</div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
