<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Telegram Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="score-box">
                <span>🏆 Рекорд: </span>
                <span id="best-score">0</span>
            </div>
            <div class="score-box">
                <span>🎯 Очки: </span>
                <span id="current-score">0</span>
            </div>
        </div>

        <div class="game-area" id="game-area">
            <div class="ground"></div>
            
            <div class="dino" id="dino">
                <div class="dino-body"></div>
                <div class="dino-head"></div>
                <div class="dino-neck"></div>
                <div class="dino-eye">
                    <div class="dino-pupil"></div>
                </div>
                <div class="dino-nostril"></div>
                <div class="dino-mouth"></div>
                <div class="dino-leg front"></div>
                <div class="dino-leg back"></div>
                <div class="dino-arm"></div>
                <div class="dino-arm left"></div>
                <div class="dino-tail"></div>
            </div>
            
            <div class="cactus" id="cactus">🌵</div>
            <div class="cloud" id="cloud">☁️</div>
            
            <!-- Экран начала -->
            <div class="screen start-screen" id="start-screen">
                <div class="screen-content">
                    <h1>🦖 DINO RUN</h1>
                    <p>Прыгай через кактусы!</p>
                    <button onclick="startGame()" class="btn">▶️ НАЧАТЬ ИГРУ</button>
                    <div class="instructions">
                        <p><strong>Управление:</strong></p>
                        <p>• Нажми на экран</p>
                        <p>• Или клавишу ПРОБЕЛ</p>
                        <p>• Или кнопку "ПРЫЖОК"</p>
                    </div>
                </div>
            </div>
            
            <!-- Экран конца игры -->
            <div class="screen game-over-screen" id="game-over-screen">
                <div class="screen-content">
                    <h2>💀 ИГРА ОКОНЧЕНА</h2>
                    <p class="final-score">Твой счёт: <span id="final-score">0</span></p>
                    <div class="buttons">
                        <button onclick="restartGame()" class="btn">🔄 Играть снова</button>
                        <button onclick="showStartScreen()" class="btn">🏠 Меню</button>
                    </div>
                </div>
            </div>
            
            <!-- Экран паузы -->
            <div class="screen pause-screen" id="pause-screen">
                <div class="screen-content">
                    <h2>⏸️ ПАУЗА</h2>
                    <button onclick="resumeGame()" class="btn">▶️ Продолжить</button>
                    <button onclick="restartGame()" class="btn">🔄 Заново</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="jump()" class="control-btn">
                <span class="btn-icon">⬆️</span>
                <span>ПРЫЖОК</span>
            </button>
            <button onclick="togglePause()" class="control-btn">
                <span class="btn-icon">⏸️</span>
                <span>ПАУЗА</span>
            </button>
        </div>

        <div class="status" id="status">Готов к игре!</div>
        
        <div class="footer">
            <p>Простая игра для Telegram Mini Apps</p>
            <p class="small">Работает на всех устройствах</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
